<html lang="en">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dadbod Bootcamp</title>
<meta name="description" content="Music trivia training for the Dadbods.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Krona+One&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5d76e; --ink:#2b1b3d; --ink-soft:#5b4c70;
  --card:#fffaf0; --coral:#ff6f59; --teal:#6fd0c4; --butter:#ffd166;
  --red:#b3261e; --green:#1f7a57;
  --display:'Krona One','Arial Black','Helvetica Neue',Arial,sans-serif;
  --body:'Barlow','Helvetica Neue',Arial,sans-serif;
  --marker:'Permanent Marker','Comic Sans MS','Marker Felt',cursive;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0; color:var(--ink); font-family:var(--body); font-size:17px; line-height:1.45; background:var(--bg); min-height:100vh}
/* the three stripes off a cassette label, used once at the top of every screen */
body::before{content:""; display:block; height:14px; border-bottom:2px solid var(--ink);
  background:linear-gradient(var(--coral) 0 4px, var(--card) 4px 8px, var(--teal) 8px 12px)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none !important}
a{color:var(--ink)}
:focus-visible{outline:3px solid var(--ink); outline-offset:3px}
.deck :focus-visible{outline-color:var(--card)}
#app{max-width:540px; margin:0 auto; padding:16px 16px 110px}
h1,h2,h3{font-family:var(--display); font-weight:400; margin:0; line-height:1.2}
h1{font-size:1.4rem}
h2{font-size:1.02rem; margin:28px 0 10px}
p{margin:0 0 10px}
.muted{color:var(--ink-soft)}
.small{font-size:.9rem}

/* hero: cassette player, headphones, wordmark */
.hero{display:block; width:100%; max-width:330px; margin:4px auto 0}
.hero .reel{transform-box:fill-box; transform-origin:center; animation:spin 5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.word{font-size:min(13vw,3.3rem); white-space:nowrap; line-height:.95; text-align:center; margin-top:12px}
.word span{display:block; font-size:.5em; letter-spacing:.24em; padding-left:.24em; margin-top:.3em}
.tagline{text-align:center; margin:14px 0 20px}
.logo-mini{display:flex; align-items:center; gap:9px; font-family:var(--display); font-size:.74rem; line-height:1.25}
.logo-mini svg{flex:none; width:44px; height:29px}

/* panels */
.card{background:var(--card); border:2px solid var(--ink); border-radius:12px; box-shadow:4px 4px 0 var(--ink); padding:16px}
.card + .card{margin-top:16px}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  min-height:50px; padding:10px 18px; border:2px solid var(--ink); border-radius:10px;
  background:var(--card); font-weight:700; font-size:1.02rem; text-decoration:none;
  box-shadow:3px 3px 0 var(--ink); transition:transform .06s, box-shadow .06s;
}
.btn:active{transform:translate(3px,3px); box-shadow:0 0 0 var(--ink)}
.btn.primary{background:var(--coral)}
.btn.wide{width:100%}
.btn:disabled{opacity:.45; cursor:not-allowed; box-shadow:none; transform:none}
.btn.plain{border:0; box-shadow:none; background:none; text-decoration:underline; min-height:44px; padding:6px 8px; font-weight:600}
.row{display:flex; gap:10px; align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1}

/* name tag, drawn as a hand-labelled tape sticker */
.tag{display:flex; align-items:center; gap:12px; border:2px solid var(--ink); border-radius:8px; padding:9px 12px 9px 30px;
  background:linear-gradient(90deg, var(--coral) 0 10px, var(--teal) 10px 18px, #fff 18px); box-shadow:3px 3px 0 var(--ink)}
.tag .who{font-family:var(--marker); font-size:1.5rem; line-height:1.1; word-break:break-word}
.patch{flex:none; width:52px; height:52px; border-radius:50%; background:var(--teal); border:2px solid var(--ink); display:grid; place-items:center; font-size:1.7rem; line-height:1}
.patch.sm{width:40px; height:40px; font-size:1.3rem}

/* welcome */
input[type=text]{width:100%; min-height:52px; padding:10px 12px; border:2px solid var(--ink); border-radius:10px; background:#fff; font-size:1.1rem}
label.lab, div.lab{display:block; font-weight:700; margin:14px 0 6px}
.avatars{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.avatars button{background:#fff; border:2px solid var(--ink); border-radius:10px; padding:8px 4px 7px; font-size:.78rem; font-weight:600; line-height:1.15; min-height:88px}
.avatars button b{display:block; font-size:1.8rem; line-height:1.2; font-weight:400}
.avatars button[aria-pressed=true]{background:var(--teal); box-shadow:inset 0 0 0 2px var(--ink)}
.rules{padding-left:20px; margin:0}
.rules li{margin-bottom:4px}

/* workout picker */
.plans{display:grid; gap:8px}
.plan{display:block; width:100%; text-align:left; background:#fff; border:2px solid var(--ink); border-radius:10px; padding:10px 12px}
.plan b{display:block; font-size:1.05rem}
.plan span{font-size:.88rem; color:var(--ink-soft)}
.plan[aria-pressed=true]{background:var(--teal); box-shadow:inset 0 0 0 2px var(--ink)}
.plan[aria-pressed=true] span{color:var(--ink)}
.seg{display:flex; border:2px solid var(--ink); border-radius:10px; overflow:hidden; background:#fff}
.seg button{flex:1; border:0; background:none; padding:10px 6px; min-height:48px; font-weight:600; border-left:2px solid var(--ink); line-height:1.15}
.seg button:first-child{border-left:0}
.seg button small{display:block; font-weight:500; font-size:.76rem}
.seg button[aria-pressed=true]{background:var(--ink); color:var(--card)}

/* meters */
.meter{display:grid; grid-template-columns:118px 1fr 44px; gap:10px; align-items:center; margin:8px 0; font-size:.93rem}
.meter .bar{height:14px; background:#fff; border:2px solid var(--ink); border-radius:7px; overflow:hidden}
.meter .bar i{display:block; height:100%; background:var(--ink)}
.meter .pct{text-align:right; font-weight:700; font-variant-numeric:tabular-nums}

/* game */
.gamebar{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px}
.gamebar .count{font-family:var(--display); font-size:.86rem}
.pips{display:flex; gap:5px; margin-bottom:12px}
.pips i{flex:1; height:9px; border:2px solid var(--ink); border-radius:5px; background:var(--card)}
.pips i.full{background:var(--green)} .pips i.half{background:linear-gradient(90deg, var(--green) 50%, var(--card) 50%)} .pips i.zero{background:var(--red)} .pips i.now{background:var(--ink)}
.deck{background:var(--ink); color:var(--card); border-radius:12px; padding:14px; border:2px solid var(--ink); box-shadow:4px 4px 0 rgba(43,27,61,.35)}
.deck canvas{display:block; width:100%; height:92px}
.deck .status{min-height:2.9em; margin:8px 0 10px; font-size:.97rem}
.deck #diag{opacity:.8; margin:-2px 0 12px}
.deck .btn{border-color:var(--card); box-shadow:3px 3px 0 rgba(255,250,240,.35)}
.deck .btn.primary{color:var(--ink)}
.listens{display:flex; gap:6px; align-items:center; font-size:.88rem}
.listens i{width:12px; height:12px; border-radius:50%; border:2px solid var(--card); background:var(--coral)}
.listens i.used{background:none; opacity:.5}
.answer{margin-top:16px}
.q{font-weight:700; margin:14px 0 6px}
.opts{display:grid; gap:8px}
.opt{width:100%; text-align:left; background:#fff; border:2px solid var(--ink); border-radius:10px; padding:10px 12px; min-height:48px; font-weight:600; line-height:1.2}
.opt[aria-pressed=true]{background:var(--teal); box-shadow:inset 0 0 0 2px var(--ink)}
.reveal .song{font-family:var(--display); font-size:1.12rem; line-height:1.25}
.reveal .by{font-size:1.12rem; font-weight:600; margin:4px 0 2px}
.verdict{display:flex; gap:10px; align-items:baseline; padding:8px 0; border-top:2px solid var(--ink)}
.verdict .mark{flex:none; width:26px; height:26px; border-radius:50%; display:grid; place-items:center; color:#fff; font-weight:700; font-size:.95rem; align-self:center}
.verdict .mark.ok{background:var(--green)} .verdict .mark.no{background:var(--red)}
.verdict .pts{margin-left:auto; font-weight:700; white-space:nowrap}
.quip{font-family:var(--marker); font-size:1.12rem; line-height:1.3; margin:12px 0 16px}

/* results */
.jersey{font-family:var(--display); font-size:4.4rem; line-height:1; text-align:center}
.jersey small{display:block; font-family:var(--body); font-size:1rem; font-weight:600; margin-top:8px}
.badge{display:flex; gap:10px; align-items:center; padding:8px 0}
.badge .ico{flex:none; width:40px; height:40px; border-radius:10px; background:var(--ink); display:grid; place-items:center; font-size:1.25rem}
.badge.locked{opacity:.45}
.recap{list-style:none; margin:0; padding:0}
.recap li{display:grid; grid-template-columns:1fr auto; gap:4px 10px; padding:9px 0; border-top:2px solid rgba(43,27,61,.18)}
.recap li:first-child{border-top:0}
.recap .pts{font-weight:700; font-variant-numeric:tabular-nums}
.recap a{font-size:.88rem}

/* roster */
.roster{list-style:none; margin:0; padding:0}
.roster li{display:grid; grid-template-columns:26px 40px 1fr auto; gap:10px; align-items:center; padding:9px 0; border-top:2px solid rgba(43,27,61,.18)}
.roster li:first-child{border-top:0}
.roster .pos{font-family:var(--display); font-size:.95rem; text-align:center}
.roster .nm{font-family:var(--marker); font-size:1.2rem; line-height:1.1; word-break:break-word}
.roster .rk{display:block; font-size:.82rem; line-height:1.25; color:var(--ink-soft)}
.roster .val{font-family:var(--display); font-size:1.02rem; text-align:right}
.roster .val small{display:block; font-family:var(--body); font-size:.72rem; color:var(--ink-soft)}
.roster li.me{background:rgba(111,208,196,.4); margin:0 -8px; padding-left:8px; padding-right:8px; border-radius:8px}
.note{background:#fff; border:2px dashed var(--ink); border-radius:10px; padding:10px 12px; font-size:.92rem}

/* scouting report */
.scout{list-style:none; margin:0; padding:0}
.scout li{display:grid; grid-template-columns:34px 1fr 48px; gap:8px; align-items:center; padding:7px 0; border-top:2px solid rgba(43,27,61,.18)}
.scout li:first-child{border-top:0}
.scout .pos{font-family:var(--display); font-size:.8rem; text-align:center}
.scout b{display:block; line-height:1.2}
.scout span{font-size:.88rem; color:var(--ink-soft)}
.scout .pl{width:46px; height:46px; border-radius:50%; border:2px solid var(--ink); background:var(--coral); font-size:1rem; font-weight:700}
.scout .pl[aria-pressed=true]{background:var(--ink); color:var(--card)}

/* tab bar */
.tabs{position:fixed; left:0; right:0; bottom:0; background:var(--card); border-top:2px solid var(--ink); display:flex; justify-content:center; padding-bottom:env(safe-area-inset-bottom)}
.tabs div{display:flex; width:100%; max-width:540px}
.tabs button{flex:1; border:0; background:none; min-height:60px; font-weight:700; font-size:.95rem; border-left:2px solid var(--ink)}
.tabs button:first-child{border-left:0}
.tabs button[aria-current=page]{background:var(--ink); color:var(--card)}

@media (min-width:600px){ #app{padding-top:28px} .avatars{grid-template-columns:repeat(4,1fr)} }
@media (prefers-reduced-motion:reduce){ .btn{transition:none} .hero .reel{animation:none} }
</style>
</head>

function quipFor(pts, song) {
  const kind = pts === 10 ? "full" : pts === 5 ? "half" : "zero", t = tierOf(song);
  const era = t === "C" ? "C" : t === "OLD" ? "OLD" : (t === "D00" || t === "D90") ? "YOURS" : null;
  let pool = QUIPS[kind];
  if (era && ERA_QUIPS[era][kind] && Math.random() < 0.4) pool = ERA_QUIPS[era][kind];
  let fresh = pool.filter(q => !usedQuips.has(q));
  if (!fresh.length) { pool.forEach(q => usedQuips.delete(q)); fresh = pool; }
  const q = fresh[Math.floor(Math.random() * fresh.length)]; usedQuips.add(q); return q;
}

function useClip(c, r) { c.url = r.url; c.src = r.src; audio.src = r.url; audio.load(); }
function loadSong(isRetry) {
  const song = game.songs[game.i], token = Math.random();

}
function swapSong(auto) {

  const tries = c.tries + 1, sub = draw(TIERS[tierOf(c.song)], 1, game.used, me())[0];

  game.songs[game.i] = sub; game.cur.tries = tries; loadSong(true);
}
function playClip(auto, free) {
  const c = game.cur; if (!c || !c.url || clipOn || c.starting) return;

  const failed = () => { c.starting = false; if (!auto && game && game.cur === c && !c.res) { c.status = "blocked"; updateDeck(); } };

}

audio.addEventListener("ended", endClip);
audio.addEventListener("error", () => {

  clipOn = false;

    // This source's audio won't play here. Drop it and try the next source for the same song.
    const c = game.cur, key = c.song.key; c.starting = false; c.skip.push(c.src);
    if (c.src === "local") { if (shared && shared[key] && shared[key].u === c.url) c.skip.push("shared"); delete store.clips[key]; saveStore(); }
    if (c.src === "shared") { delete store.clips[key]; saveStore(); }
    if (c.src === "deezer") delete memClips[key];
    c.url = null; c.status = "loading"; updateDeck();
    resolveClip(c.song, c.skip.slice()).then(r => { if (game && game.cur === c) { useClip(c, r); c.status = c.plays ? "played" : "ready"; updateDeck(); } })
      .catch(e => { if (game && game.cur === c) { game.diag = "audio failed from " + c.skip.join(" and ") + ", then " + (e.log || []).join(", "); c.status = "error"; updateDeck(); } });
  } else if (ui.screen === "scout" && ui.scoutKey) { ui.scoutKey = null; render(); }
});

function bindGameInputs() {

function updateDeck() {
  if (ui.screen !== "game" || !game) return; const c = game.cur, st = $("#status"), pb = $("#playbtn"), lock = $("#lock"); if (!st) return;
  const left = 2 - c.plays, secs = game.clip;
  const msg = { loading: "Cueing up the next song…", ready: `Two listens, ${secs} seconds each. Tap play when you're ready.`, blocked: "Your browser wants a tap first. Hit play.",
    playing: `Playing. Listen ${c.plays} of 2.`, played: left ? "One listen left. Answer now or spend it." : "That's both listens. Lock in your answer.",
    error: "This clip wouldn't load. Check your connection, or swap in a different song.", done: clipOn ? "Playing it back. Match the sound to the name." : "Now that you know it, give it one more listen." }[c.res ? "done" : c.status];

function submitAnswer(gaveUp) {

function nextSong() { if (game.i >= 9) return finishRound(); game.i++; loadSong(); window.scrollTo(0, 0); }

function finishRound() {

  const wk = weekKey(); if (p.weekKey !== wk) { p.weekKey = wk; p.weekXp = 0; }
  const oldRank = rankOf(p.xp);
  p.xp += xp; p.weekXp += xp; p.rounds++;

  const earn = [], give = id => { if (!p.badges.includes(id)) { p.badges.push(id); earn.push(id); } };

  return `<h1 style="margin-bottom:12px">The roster</h1>
  <div class="seg" role="group" aria-label="Ranking">${[["week", "This week"], ["all", "All time"], ["hard", "Best hard round"]].map(([k, l]) => `<button data-act="lbtab" data-v="${k}" aria-pressed="${tab === k}">${l}</button>`).join("")}</div>
  <div class="card" style="margin-top:14px"><ol class="roster">${rows.map((r, i) => `<li class="${r.id === store.current ? "me" : ""}"><span class="pos">${i + 1}</span><span class="patch sm">${(AVATARS[r.p.avatar] || AVATARS[0])[0]}</span><span><span class="nm">${esc(r.p.name)}</span><span class="rk">${esc(rankOf(r.p.xp || 0))}, ${r.p.rounds || 0} workout${r.p.rounds === 1 ? "" : "s"}</span></span><span class="val">${r.v}<small>${unit}</small></span></li>`).join("")}</ol></div>
  ${net.status === "off" ? `<p class="note" style="margin-top:14px">The shared leaderboard isn't connected yet, so this only shows scores from this phone. Colin: paste the database address into the coach settings at the top of the page's code.</p>` : ""}
  ${net.status === "error" ? `<p class="note" style="margin-top:14px" role="alert">Couldn't reach the shared leaderboard, so this may be out of date. Your scores are saved on this phone and will sync after your next workout.</p>` : ""}
  ${net.status === "loading" ? `<p class="muted" style="margin-top:14px">Loading the rest of the roster…</p>` : ""}
  ${libraryHtml()}
  ${wall.length ? `<h2>The team's blind spots</h2><div class="card"><ul class="recap">${wall.map(k => `<li><div><b>${esc(BY_KEY[k].t)}</b><br>${esc(BY_KEY[k].artist)} <a href="${ytLink(BY_KEY[k])}" target="_blank" rel="noopener">Listen</a></div><div class="pts small">${shame[k]} dads</div></li>`).join("")}</ul></div>` : ""}`;
}

/* ---------- scouting report ---------- */
function viewScout() {
  const list = TIERS.C.slice().sort((a, b) => a.pos - b.pos);
  return `<h1 style="margin-bottom:6px">Scouting report</h1>
  <p>What the youths are listening to: the Billboard Hot 100 for the week of ${esc(CHART_DATE)}. Tap play for a ${store.settings.clip}-second clip. No points, no judgment.</p>
  <div class="card"><ul class="scout">${list.map(s => `<li><span class="pos">${s.pos}</span><span><b>${esc(s.t)}</b><span>${esc(s.artist)}</span></span><button class="pl" data-act="scout" data-k="${s.key}" aria-pressed="${ui.scoutKey === s.key}" aria-label="${ui.scoutKey === s.key ? "Stop" : "Play"} ${esc(s.t)}">${ui.scoutKey === s.key ? "■" : "▶"}</button></li>`).join("")}</ul></div>
  <p class="small muted" style="margin-top:12px">Halloween and Christmas re-entries are left off. They live in the older eras.</p>`;
}
function scoutPlay(key) {
  if (ui.scoutKey === key) { stopAudio(); ui.scoutKey = null; render(); return; }
  stopAudio(); ui.scoutKey = key; render();
  // iPhones only let audio start from inside a tap, and finding the clip takes a moment. Start a blip of silence now so the real clip may follow.
  try { audio.src = SILENCE; const warm = audio.play(); if (warm && warm.catch) warm.catch(() => {}); } catch (e) {}
  resolveClip(BY_KEY[key]).then(r => {
    if (ui.screen !== "scout" || ui.scoutKey !== key) return;
    audio.src = r.url; clipLimit = store.settings.clip;
    const pr = audio.play(); const ok = () => { clipOn = true; };
    if (pr && pr.then) pr.then(ok).catch(() => { ui.scoutKey = null; render(); }); else ok();
  }).catch(() => { if (ui.scoutKey === key) { ui.scoutKey = null; render(); } });
}

/* ---------- clip library: save every song's link so iPhones never need Apple's search ---------- */
let stock = { on: false, msg: "" }, stockDelay = 3200, stockPause = 60000;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const savedCount = () => (shared ? SONGS.filter(s => shared[s.key] && shared[s.key].u).length : 0);
function libraryHtml() {
  if (!DB) return "";
  const n = savedCount(), left = SONGS.length - n;
  return `<h2>Clip library</h2><div class="card"><p><b id="libcount">${n} of ${SONGS.length}</b> songs are saved for the team.</p>
  <p class="small muted">Apple won't let iPhones look songs up, so iPhones play from this saved list, and from Deezer for anything not on it. Computers and Android phones add to the list as they play.</p>
  ${IS_IPHONE ? "" : !left && !stock.on ? `<p class="small" style="margin:0"><b>Fully stocked.</b></p>` : `<button class="btn ${stock.on ? "" : "primary"}" data-act="stock">${stock.on ? "Stop saving" : `Save the other ${left} now`}</button>
  <p class="small muted" id="stockmsg" style="margin:10px 0 0" aria-live="polite">${esc(stock.msg || `Takes about ${Math.max(1, Math.ceil(left * 3.6 / 60))} minutes. Keep this tab open and in front.`)}</p>`}</div>`;
}
function paintStock() { const a = $("#libcount"), b = $("#stockmsg"); if (a) a.textContent = savedCount() + " of " + SONGS.length; if (b) b.textContent = stock.msg; }
async function runStock() {
  stock.on = true; stock.msg = "Starting…"; if (ui.screen === "board") render();
  await loadShared(); shared = shared || {};
  let missing = 0, streak = 0;
  for (const s of SONGS.filter(x => !(shared[x.key] && shared[x.key].u))) {
    if (!stock.on) break;
    try { await SOURCES.apple(s); streak = 0; }
    catch (e) {
      if (e.message === "no match") missing++;
      else if (++streak >= 3) { stock.msg = "Apple asked us to slow down. Pausing for a minute, then carrying on."; paintStock(); await sleep(stockPause); streak = 0; }
    }
    stock.msg = "Saving. " + (SONGS.length - savedCount()) + " to go" + (missing ? ", " + missing + " not on Apple (those use Deezer)" : "") + "."; paintStock();
    await sleep(stockDelay);
  }
  const left = SONGS.length - savedCount();
  stock.on = false; stock.msg = left ? "Stopped with " + left + " to go. Tap the button again any time to pick up where this left off." : "";
  if (ui.screen === "board") render();
}

/* ---------- waveform + clip timer ---------- */
function tick() {
  if (clipOn && audio.currentTime >= clipLimit) endClip();
  const cv = $("#wave");
  if (cv && game && game.cur) {
    const ctx = cv.getContext("2d"), W = cv.width, H = cv.height, c = game.cur, n = BARS, gap = 3, bw = (W - gap * (n - 1)) / n;
    const prog = clipOn ? Math.min(1, audio.currentTime / game.clip) : (c.plays && !c.res ? 1 : 0);
    const still = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    ctx.clearRect(0, 0, W, H);
    for (let i = 0; i < n; i++) {
      const at = i / n; let v = c.status === "loading" ? 0.06 : c.peaks[i];
      if (clipOn && !still) { const d = Math.abs(at - prog); if (d < 0.06) v = Math.min(1, v * (1 + 0.35 * Math.sin(performance.now() / 70 + i))); }
      const h = Math.max(4, v * (H - 8)), x = i * (bw + gap), y = (H - h) / 2;
      ctx.fillStyle = clipOn ? (at <= prog ? "#ff6f59" : "rgba(255,250,240,.28)") : (c.plays ? "rgba(255,111,89,.6)" : "rgba(255,250,240,.28)");
      ctx.fillRect(x, y, bw, h);
    }
  }
  requestAnimationFrame(tick);
}

/* ---------- actions ---------- */
const actions = {
  avatar(el) { ui.avatar = +el.dataset.i; document.querySelectorAll(".avatars button").forEach(b => b.setAttribute("aria-pressed", b === el)); },
  async join() {
    const name = ($("#name").value || "").trim().replace(/\s+/g, " "), err = $("#joinerr");
    if (name.length < 2) { err.textContent = "Type a name first, at least two letters."; $("#name").focus(); return; }
    const id = slug(name);
    if (store.profiles[id]) { store.current = id; store.profiles[id].avatar = ui.avatar; saveStore(); syncMe(); return go("home"); }
    if (DB && net.status === "loading") { err.style.color = "var(--ink-soft)"; err.textContent = "Checking the roster…"; await fetchPlayers(); }
    if (net.players[id]) { ui.clash = { id, name: net.players[id].name }; return render(); }
    store.profiles[id] = newProfile(name, ui.avatar); store.current = id; saveStore(); syncMe(); go("home");
  },
  claim() { adoptRemote(ui.clash.id, net.players[ui.clash.id]); store.current = ui.clash.id; ui.clash = null; saveStore(); go("home"); },
  unclash() { ui.clash = null; render(); },
  resume(el) { if (store.profiles[el.dataset.id]) { store.current = el.dataset.id; saveStore(); go("home"); } },
  switch() { store.current = null; saveStore(); ui.clash = null; go("welcome"); },
  nav(el) { go(el.dataset.to); },
  plan(el) { store.settings.plan = el.dataset.id; saveStore(); render(); },
  mode(el) { store.settings.mode = el.dataset.v; saveStore(); render(); },
  clip(el) { store.settings.clip = +el.dataset.v; saveStore(); render(); },
  start() { startRound(); },
  play() { playClip(false); },
  again() { playClip(false, true); },
  swap() { swapSong(false); },
  pickA(el) { game.cur.pickA = +el.dataset.i; el.parentNode.querySelectorAll(".opt").forEach(b => b.setAttribute("aria-pressed", b === el)); updateDeck(); },
  pickT(el) { game.cur.pickT = +el.dataset.i; el.parentNode.querySelectorAll(".opt").forEach(b => b.setAttribute("aria-pressed", b === el)); updateDeck(); },
  submit() { submitAnswer(false); },
  giveup() { submitAnswer(true); },
  next() { nextSong(); },
  quit() { game = null; go("home"); },
  lbtab(el) { ui.lbTab = el.dataset.v; render(); },
  scout(el) { scoutPlay(el.dataset.k); },
  stock() { if (stock.on) { stock.on = false; stock.msg = "Stopping…"; paintStock(); } else runStock(); }
};
document.addEventListener("click", e => { const el = e.target.closest("[data-act]"); if (el && !el.disabled && actions[el.dataset.act]) actions[el.dataset.act](el, e); });

/* ---------- boot ---------- */
loadStore();
if (!store.profiles[store.current]) store.current = null;
ui.screen = store.current ? "home" : "welcome";
render(); requestAnimationFrame(tick);
if (DB) {
  loadShared();
  const repaint = () => { if (ui.screen === "home" || ui.screen === "board") render(); };
  // Scores earned before the leaderboard was connected live only on this device. Send them up, merged with anything already there.
  fetchPlayers().then(repaint); syncMe().then(repaint);
}
</script>
</body>
</html>
